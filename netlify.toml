# Sitio estático. En Netlify deja el comando de build vacío.
# Publish directory: .   (punto). Si el repo es todo LivePulse, Base directory: sitio.

[build]
  publish = "."

# Los programas viven en GitHub. Estas redirecciones evitan que Netlify
# entregue el archivo si alguien abre la ruta vieja del sitio.
[[redirects]]
  from = "/descargas/windows/LivePulse-Setup.exe"
  to = "https://raw.githubusercontent.com/2591740-dotcom/Livepulse/85ce0a49f1070ef12a04493a37c3a51e1000448f/descargas/windows/LivePulse-Setup.exe"
  status = 301
  force = true

[[redirects]]
  from = "/descargas/windows/LivePulse-Portable.exe"
  to = "https://raw.githubusercontent.com/2591740-dotcom/Livepulse/85ce0a49f1070ef12a04493a37c3a51e1000448f/descargas/windows/LivePulse-Portable.exe"
  status = 301
  force = true

[[redirects]]
  from = "/descargas/mac/LivePulse.dmg"
  to = "https://raw.githubusercontent.com/2591740-dotcom/Livepulse/main/descargas/mac/LivePulse.dmg"
  status = 301
  force = true

[[redirects]]
  from = "/descargas/android/LivePulse.apk"
  to = "https://raw.githubusercontent.com/2591740-dotcom/Livepulse/main/descargas/android/LivePulse.apk"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/descargas/windows/*.exe"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/descargas/android/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/descargas/mac/*.dmg"
  [headers.values]
    Content-Type = "application/x-apple-diskimage"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/enlaces.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
